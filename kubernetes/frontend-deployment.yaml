apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: petclinic

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

      - name: frontend

        image: saikumaar/frontend3:v3

        ports:

        - containerPort: 80