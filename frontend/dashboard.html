<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand" href="dashboard.html">
                🐾 Pet Clinic
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="owners.html">Owners</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pets.html">Pets</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="doctors.html">Doctors</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="appointments.html">Appointments</a>
                    </li>

                </ul>

                <a href="index.html" class="btn btn-light me-2">
                    Home
                </a>

                <a href="login.html" class="btn btn-warning">
                    Logout
                </a>

            </div>

        </div>

    </nav>

    <!-- Dashboard -->

    <div class="container mt-4">

        <h2 class="mb-4">
            Welcome Administrator
        </h2>

        <div class="row">

            <div class="col-md-3 mb-4">

                <div class="card shadow text-center">

                    <div class="card-body">

                        <i class="fa-solid fa-dog fa-3x text-primary"></i>

                        <h2 id="petsCount">0</h2>

                        <h5>Pets</h5>

                        <a href="pets.html" class="btn btn-primary">
                            Manage
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-3 mb-4">

                <div class="card shadow text-center">

                    <div class="card-body">

                        <i class="fa-solid fa-user fa-3x text-success"></i>

                        <h2 id="ownersCount">0</h2>

                        <h5>Owners</h5>

                        <a href="owners.html" class="btn btn-success">
                            Manage
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-3 mb-4">

                <div class="card shadow text-center">

                    <div class="card-body">

                        <i class="fa-solid fa-user-doctor fa-3x text-danger"></i>

                        <h2 id="doctorsCount">0</h2>

                        <h5>Doctors</h5>

                        <a href="doctors.html" class="btn btn-danger">
                            Manage
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-3 mb-4">

                <div class="card shadow text-center">

                    <div class="card-body">

                        <i class="fa-solid fa-calendar-days fa-3x text-warning"></i>

                        <h2 id="appointmentsCount">0</h2>

                        <h5>Appointments</h5>

                        <a href="appointments.html" class="btn btn-warning">
                            Manage
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>

    <script>

        fetch("http://localhost:5000/dashboard")
            .then(response => response.json())
            .then(data => {

                document.getElementById("petsCount").innerText = data.pets;
                document.getElementById("ownersCount").innerText = data.owners;
                document.getElementById("doctorsCount").innerText = data.doctors;
                document.getElementById("appointmentsCount").innerText = data.appointments;

            })
            .catch(error => console.log(error));

    </script>

</body>

</html>
