<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">
            🐾 Pet Clinic
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="owners.html">Owners</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="pets.html">Pets</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="doctors.html">Doctors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="appointments.html">Appointments</a>
                </li>

            </ul>

            <a href="index.html" class="btn btn-light me-2">
                Home
            </a>

            <a href="login.html" class="btn btn-warning">
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">
        <i class="fa-solid fa-user"></i> Owners
    </h2>

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            Add New Owner

        </div>

        <div class="card-body">

            <form id="ownerForm">

                <div class="row">

                    <div class="col-md-3 mb-3">

                        <input type="text"
                               id="name"
                               class="form-control"
                               placeholder="Owner Name"
                               required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <input type="text"
                               id="phone"
                               class="form-control"
                               placeholder="Phone"
                               required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="Email"
                               required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <input type="text"
                               id="address"
                               class="form-control"
                               placeholder="Address"
                               required>

                    </div>

                </div>

                <button class="btn btn-success">
                    Save Owner
                </button>

            </form>

        </div>

    </div>

    <br>

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            Owner List

        </div>

        <div class="card-body">

            <table class="table table-bordered table-striped">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Address</th>

                </tr>

                </thead>

                <tbody id="ownersTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

<script src="js/owners.js"></script>

</body>

</html>
