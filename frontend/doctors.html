<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">
            🐾 Pet Clinic
        </a>

        <div>

            <a href="dashboard.html" class="btn btn-light">
                Dashboard
            </a>

        </div>

    </div>

</nav>

<!-- Main -->

<div class="container mt-4">

<div class="row">

<!-- Form -->

<div class="col-md-4">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h4>Add Owner</h4>

</div>

<div class="card-body">

<form id="ownerForm">

<div class="mb-3">

<label>Name</label>

<input
type="text"
id="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
id="phone"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Address</label>

<textarea
id="address"
class="form-control"
rows="3"
required></textarea>

</div>

<button
class="btn btn-success w-100">

Save Owner

</button>

</form>

</div>

</div>

</div>

<!-- Table -->

<div class="col-md-8">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h4>Owner List</h4>

</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Name</th>

<th>Phone</th>

<th>Email</th>

<th>Address</th>

</tr>

</thead>

<tbody id="ownerTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<script>

const API="const API_URL = "/api";

function loadOwners(){

fetch(API+"/owners")

.then(res=>res.json())

.then(data=>{

let rows="";

data.forEach(owner=>{

rows+=`

<tr>

<td>${owner.id}</td>

<td>${owner.name}</td>

<td>${owner.phone}</td>

<td>${owner.email}</td>

<td>${owner.address}</td>

</tr>

`;

});

document.getElementById("ownerTable").innerHTML=rows;

});

}

loadOwners();

document.getElementById("ownerForm").addEventListener("submit",function(e){

e.preventDefault();

const owner={

name:document.getElementById("name").value,

phone:document.getElementById("phone").value,

email:document.getElementById("email").value,

address:document.getElementById("address").value

};

fetch(API+"/owners",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(owner)

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

document.getElementById("ownerForm").reset();

loadOwners();

})

.catch(err=>console.log(err));

});

</script>

</body>

</html>
