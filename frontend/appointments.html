<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Appointments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">
            🐾 Pet Clinic
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="owners.html">Owners</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="pets.html">Pets</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="doctors.html">Doctors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="appointments.html">Appointments</a>
                </li>

            </ul>

            <a href="index.html" class="btn btn-light me-2">
                Home
            </a>

            <button onclick="logout()" class="btn btn-warning">
                Logout
            </button>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">

        <i class="fa-solid fa-calendar-days"></i>
        Appointments

    </h2>

    <div class="card shadow">

        <div class="card-header bg-warning">

            Schedule Appointment

        </div>

        <div class="card-body">

            <form id="appointmentForm">

                <div class="row">

                    <div class="col-md-3 mb-3">

                        <input
                            type="number"
                            id="pet_id"
                            class="form-control"
                            placeholder="Pet ID"
                            required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <input
                            type="number"
                            id="doctor_id"
                            class="form-control"
                            placeholder="Doctor ID"
                            required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <input
                            type="datetime-local"
                            id="appointment_date"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <select id="status" class="form-select">

                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>

                        </select>

                    </div>

                </div>

                <button class="btn btn-warning">

                    Book Appointment

                </button>

            </form>

        </div>

    </div>

    <br>

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            Appointment List

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Pet ID</th>
                    <th>Doctor ID</th>
                    <th>Appointment Date</th>
                    <th>Status</th>

                </tr>

                </thead>

                <tbody id="appointmentsTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

<script src="js/appointments.js"></script>

</body>

</html>
