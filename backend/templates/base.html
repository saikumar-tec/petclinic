<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Pet Clinic{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-2 bg-dark text-white min-vh-100">

    <h3 class="text-center mt-4">
        🐶 Pet Clinic
    </h3>

    <hr>

    <ul class="nav flex-column">

        <li class="nav-item mb-2">
            <a href="/" class="nav-link text-white">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="/pets" class="nav-link text-white">
                <i class="bi bi-heart"></i>
                Pets
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="/owners" class="nav-link text-white">
                <i class="bi bi-people"></i>
                Owners
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="/doctors" class="nav-link text-white">
                <i class="bi bi-person-badge"></i>
                Doctors
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="/appointments" class="nav-link text-white">
                <i class="bi bi-calendar-check"></i>
                Appointments
            </a>
        </li>

    </ul>

</div>

<!-- Main Content -->

<div class="col-md-10">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

<div class="container-fluid">

<h4 class="mt-2">

Pet Clinic Management System

</h4>

<div class="ms-auto">

<button class="btn btn-outline-primary">

Admin

</button>

</div>

</div>

</nav>

<div class="container mt-4">

{% block content %}

{% endblock %}

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
