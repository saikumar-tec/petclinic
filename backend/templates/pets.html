{% extends "base.html" %}

{% block title %}Pets{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>🐶 Pet Management</h2>

        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addPetModal">

            <i class="bi bi-plus-circle"></i>

            Add Pet

        </button>

    </div>

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            Registered Pets

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-light">

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Breed</th>

                    <th>Age</th>

                    <th>Gender</th>

                    <th>Vaccination</th>

                    <th>Owner ID</th>

                    <th width="180">Actions</th>

                </tr>

                </thead>

                <tbody id="petTable">

                <tr>

                    <td colspan="8" class="text-center">

                        Loading...

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Add Pet Modal -->

<div class="modal fade" id="addPetModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Add New Pet</h5>

<button class="btn-close"
data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<form id="petForm">

<div class="mb-3">

<label>Name</label>

<input
id="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Breed</label>

<input
id="breed"
class="form-control">

</div>

<div class="mb-3">

<label>Age</label>

<input
type="number"
id="age"
class="form-control">

</div>

<div class="mb-3">

<label>Gender</label>

<select
id="gender"
class="form-select">

<option>Male</option>

<option>Female</option>

</select>

</div>

<div class="mb-3">

<label>Vaccination</label>

<select
id="vaccination"
class="form-select">

<option>Completed</option>

<option>Pending</option>

</select>

</div>

<div class="mb-3">

<label>Owner ID</label>

<input
type="number"
id="owner"
class="form-control">

</div>

<button
type="submit"
class="btn btn-success">

Save Pet

</button>

</form>

</div>

</div>

</div>

</div>

<script>

loadPets();

function loadPets(){

fetch("/pets")

.then(res=>res.json())

.then(data=>{

let rows="";

data.forEach(p=>{

rows+=`

<tr>

<td>${p.id}</td>

<td>${p.name}</td>

<td>${p.breed}</td>

<td>${p.age}</td>

<td>${p.gender}</td>

<td>${p.vaccination_status}</td>

<td>${p.owner_id}</td>

<td>

<button
class="btn btn-warning btn-sm"
onclick="editPet(${p.id})">

Edit

</button>

<button
class="btn btn-danger btn-sm"
onclick="deletePet(${p.id})">

Delete

</button>

</td>

</tr>

`;

});

document.getElementById("petTable").innerHTML=rows;

});

}

document.getElementById("petForm")

.addEventListener("submit",function(e){

e.preventDefault();

fetch("/pets",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

name:document.getElementById("name").value,

breed:document.getElementById("breed").value,

age:document.getElementById("age").value,

gender:document.getElementById("gender").value,

vaccination_status:document.getElementById("vaccination").value,

owner_id:document.getElementById("owner").value

})

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

location.reload();

});

});

function deletePet(id){

if(confirm("Delete this pet?")){

fetch("/pets/"+id,{

method:"DELETE"

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

loadPets();

});

}

}

function editPet(id){

let name=prompt("Enter New Pet Name");

if(name==null)return;

fetch("/pets/"+id,{

method:"PUT",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

name:name,

breed:"Updated Breed",

age:2,

gender:"Male",

vaccination_status:"Completed",

owner_id:1

})

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

loadPets();

});

}

</script>

{% endblock %}
